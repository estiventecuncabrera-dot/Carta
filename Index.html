<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Una nota para ti ✨</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at top left, #fff5f5 0%, #fef2f2 40%, #ffe4e6 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .font-serif-title {
      font-family: 'Playfair Display', serif;
    }
    .fade-out {
      opacity: 0;
      transform: scale(0.95);
      transition: all 0.3s ease;
      pointer-events: none;
    }
    .pop-in {
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.8) translateY(10px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
  </style>
</head>
<body class="p-4 sm:p-6 text-gray-800">

  <main class="w-full max-w-md mx-auto">
    <div class="bg-white/90 backdrop-blur-md rounded-3xl p-8 sm:p-10 shadow-2xl shadow-rose-900/10 border border-rose-100/80 text-center relative overflow-hidden">
      
      <!-- Decorative element -->
      <div class="w-16 h-16 bg-rose-100 text-rose-500 rounded-2xl flex items-center justify-center mx-auto mb-6 text-2xl shadow-inner">
        💌
      </div>

      <!-- Main message text -->
      <p class="font-serif-title text-gray-800 text-lg sm:text-xl leading-relaxed italic mb-8">
        "Viendo esta foto quiero darme el atrevimiento a decirle muchas cosas... muchas cosas que he visto, ciertos halagos que le quedarán cortos."
      </p>

      <div id="buttonArea" class="relative min-h-[60px] flex items-center justify-center">
        <!-- First Button -->
        <button 
          id="btnInitial" 
          onclick="handleFirstClick()" 
          class="w-full bg-rose-500 hover:bg-rose-600 text-white font-semibold py-4 px-6 rounded-2xl shadow-lg shadow-rose-500/25 transition-all duration-300 transform hover:-translate-y-0.5 active:translate-y-0 text-base flex items-center justify-center gap-2"
        >
          <span>Ver lo que pensé al verte 💭</span>
        </button>

        <!-- Second Button (Initially Hidden) -->
        <button 
          id="btnProposal" 
          onclick="handleFinalClick()" 
          class="hidden w-full bg-gradient-to-r from-rose-600 to-pink-600 hover:from-rose-700 hover:to-pink-700 text-white font-bold py-4 px-6 rounded-2xl shadow-xl shadow-rose-600/30 transition-all duration-300 pop-in text-base flex items-center justify-center gap-2"
        >
          <span>Para ver esto es necesario salir con el creador ✨</span>
        </button>
      </div>

    </div>
  </main>

  <div id="modalConfirm" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-gray-900/40 backdrop-blur-sm opacity-0 pointer-events-none transition-all duration-400">
    <div class="bg-white rounded-3xl p-6 sm:p-8 max-w-xs w-full text-center shadow-2xl border border-rose-100 pop-in">
      
      <div class="w-16 h-16 bg-rose-500 text-white rounded-full flex items-center justify-center mx-auto mb-4 text-2xl shadow-lg shadow-rose-500/30">
        🌹
      </div>

      <h3 class="font-serif-title text-2xl font-bold text-gray-900 mb-2">¡Trato hecho!</h3>
      <p class="text-gray-600 text-sm leading-relaxed mb-6">
        Cita confirmada. Nos vemos pronto.
      </p>

      <button 
        onclick="closeModal()" 
        class="w-full bg-gray-100 hover:bg-gray-200 text-gray-800 font-semibold py-3 px-4 rounded-xl transition-all text-sm"
      >
        Cerrar
      </button>

    </div>
  </div>

  <script>
    function handleFirstClick() {
      const btnInitial = document.getElementById('btnInitial');
      const btnProposal = document.getElementById('btnProposal');

      // Animate out the first button
      btnInitial.classList.add('fade-out');

      setTimeout(() => {
        btnInitial.classList.add('hidden');
        btnProposal.classList.remove('hidden');
      }, 300);
    }

    function handleFinalClick() {
      // Trigger confetti effect
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 100,
          spread: 70,
          origin: { y: 0.6 },
          colors: ['#f43f5e', '#fb7185', '#ffe4e6', '#fbbf24']
        });
      }

      // Show confirmation popup
      const modal = document.getElementById('modalConfirm');
      modal.classList.remove('opacity-0', 'pointer-events-none');
      modal.classList.add('opacity-100');
    }

    function closeModal() {
      const modal = document.getElementById('modalConfirm');
      modal.classList.add('opacity-0', 'pointer-events-none');
      modal.classList.remove('opacity-100');
    }
  </script>

</body>
</html>
